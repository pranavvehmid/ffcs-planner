<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="FFCS Planner: clash-free VIT timetables, planned for you">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#000" opacity=".16"/>
    </pattern>
    <style>
      .t { font-family: "Arial Black", "Segoe UI Black", Impact, sans-serif; font-weight: 900; }
      .b { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; }
      .card { stroke: #000; stroke-width: 4; }
      .pop { transform-box: fill-box; transform-origin: center; animation: pop 6s ease-in-out infinite; }
      .p1 { animation-delay: .2s } .p2 { animation-delay: .5s } .p3 { animation-delay: .8s } .p4 { animation-delay: 1.1s }
      .p5 { animation-delay: 1.4s } .p6 { animation-delay: 1.7s } .p7 { animation-delay: 2s } .p8 { animation-delay: 2.3s }
      .p9 { animation-delay: 2.6s } .p10 { animation-delay: 2.9s } .p11 { animation-delay: 3.2s } .p12 { animation-delay: 3.5s }
      @keyframes pop { 0% { opacity: 0; transform: scale(.4) } 8% { opacity: 1; transform: scale(1.12) } 12% { transform: scale(1) } 85% { opacity: 1 } 100% { opacity: 0 } }
      .float { animation: float 4s ease-in-out infinite; }
      .float2 { animation: float 5s ease-in-out infinite reverse; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
      .spin { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .blink { animation: blink 1.2s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .scan { animation: scan 6s ease-in-out infinite; }
      @keyframes scan { 0% { transform: translateX(0) } 50% { transform: translateX(400px) } 100% { transform: translateX(0) } }
    </style>
  </defs>
  <rect width="1200" height="420" fill="#FFFFF0"/>
  <rect width="1200" height="420" fill="url(#dots)"/>

  <!-- title card -->
  <g class="float">
    <rect x="58" y="62" width="560" height="232" rx="30" fill="#000"/>
    <rect x="50" y="54" width="560" height="232" rx="30" fill="#D0FF00" class="card"/>
    <rect x="80" y="82" width="250" height="36" rx="18" fill="#fff" class="card" stroke-width="3"/>
    <text x="205" y="107" text-anchor="middle" class="b" font-size="17">VIT Vellore · Winter 2026-27</text>
    <text x="80" y="185" class="t" font-size="70">FFCS</text>
    <text x="80" y="255" class="t" font-size="70">Planner</text>
  </g>
  <!-- sparkles -->
  <path class="spin" d="M640 40c1.6 15 6.4 22.4 29 29.4-22.6 7-27.4 14.4-29 29.4-1.6-15-6.4-22.4-29-29.4 22.6-7 27.4-14.4 29-29.4z" fill="#000"/>
  <path class="spin" style="animation-duration:6s" d="M1150 352c1 9 4 13.5 17.5 17.7-13.5 4.2-16.5 8.7-17.5 17.7-1-9-4-13.5-17.5-17.7 13.5-4.2 16.5-8.7 17.5-17.7z" fill="#000"/>

  <!-- tagline chips -->
  <g class="float2">
    <rect x="58" y="326" width="236" height="44" rx="22" fill="#70FFC0" class="card" stroke-width="3"/>
    <text x="176" y="354" text-anchor="middle" class="b" font-size="18">0 clashes, always</text>
    <rect x="308" y="326" width="262" height="44" rx="22" fill="#E0D0FF" class="card" stroke-width="3"/>
    <text x="439" y="354" text-anchor="middle" class="b" font-size="18">every timetable checked</text>
    <rect x="584" y="326" width="180" height="44" rx="22" fill="#FFE0B0" class="card" stroke-width="3"/>
    <text x="674" y="354" text-anchor="middle" class="b" font-size="18">6 smart plans</text>
  </g>

  <!-- mini timetable -->
  <g transform="translate(680 40)">
    <rect x="8" y="8" width="480" height="270" rx="26" fill="#000"/>
    <rect x="0" y="0" width="480" height="270" rx="26" fill="#fff" class="card"/>
    <g class="b" font-size="15">
      <rect x="64" y="16" width="76" height="30" rx="10" fill="#A0E0FF" class="card" stroke-width="2.5"/><text x="102" y="37" text-anchor="middle">Mon</text>
      <rect x="146" y="16" width="76" height="30" rx="10" fill="#A0E0FF" class="card" stroke-width="2.5"/><text x="184" y="37" text-anchor="middle">Tue</text>
      <rect x="228" y="16" width="76" height="30" rx="10" fill="#A0E0FF" class="card" stroke-width="2.5"/><text x="266" y="37" text-anchor="middle">Wed</text>
      <rect x="310" y="16" width="76" height="30" rx="10" fill="#A0E0FF" class="card" stroke-width="2.5"/><text x="348" y="37" text-anchor="middle">Thu</text>
      <rect x="392" y="16" width="76" height="30" rx="10" fill="#A0E0FF" class="card" stroke-width="2.5"/><text x="430" y="37" text-anchor="middle">Fri</text>
      <text x="18" y="76" font-size="12">8 AM</text><text x="18" y="136" font-size="12">11 AM</text><text x="18" y="196" font-size="12">2 PM</text><text x="18" y="246" font-size="12">5 PM</text>
    </g>
    <rect x="64" y="150" width="404" height="16" fill="#E6E6CC"/>
    <text x="266" y="162" text-anchor="middle" class="b" font-size="11" fill="#555">LUNCH</text>
    <g class="card" stroke-width="2.5">
      <rect class="pop p1" x="66" y="84" width="72" height="56" rx="10" fill="#A0F0F0"/>
      <rect class="pop p2" x="148" y="84" width="72" height="56" rx="10" fill="#A0F0F0"/>
      <rect class="pop p3" x="312" y="58" width="72" height="56" rx="10" fill="#A0F0F0"/>
      <rect class="pop p4" x="66" y="172" width="72" height="26" rx="9" fill="#70FFC0"/>
      <rect class="pop p5" x="148" y="172" width="72" height="26" rx="9" fill="#70FFC0"/>
      <rect class="pop p6" x="230" y="172" width="72" height="26" rx="9" fill="#70FFC0"/>
      <rect class="pop p7" x="312" y="172" width="72" height="26" rx="9" fill="#70FFC0"/>
      <rect class="pop p8" x="394" y="172" width="72" height="26" rx="9" fill="#70FFC0"/>
      <rect class="pop p9" x="148" y="204" width="72" height="26" rx="9" fill="#70FFC0"/>
      <rect class="pop p10" x="230" y="204" width="72" height="26" rx="9" fill="#FFD4E4"/>
      <rect class="pop p11" x="394" y="204" width="72" height="26" rx="9" fill="#70FFC0"/>
      <rect class="pop p12" x="66" y="236" width="72" height="26" rx="9" fill="#FFE0B0"/>
    </g>
    <rect class="scan" x="64" y="52" width="4" height="214" fill="#D0FF00" stroke="#000" stroke-width="1.5"/>
  </g>
  <text x="792" y="355" class="b" font-size="18">Checking every clash-free week<tspan class="blink">_</tspan></text>
</svg>
